{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Página no encontrada | CRM Veterinario</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f1f5f9;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 620px);
      padding: 36px 24px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
    }

    .codigo {
      margin: 0;
      color: #0f766e;
      font-size: 64px;
      font-weight: bold;
    }

    img {
      display: block;
      width: min(100%, 340px);
      max-height: 260px;
      object-fit: contain;
      margin: 20px auto;
    }

    h1 {
      font-size: 26px;
    }

    p {
      color: #475569;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #0f766e;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      background: #115e59;
    }

    a:focus-visible {
      outline: 3px solid #0284c7;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <img
      class="animacion"
      src="{% static 'inventario/img/error404.gif' %}"
      alt=""
      onerror="this.hidden = true; this.style.display = 'none';"
    >

    <h1>No encontramos esta página</h1>

    <p>
      La dirección puede estar mal escrita
      o la página ya no está disponible.
    </p>

    <a href="{% url 'bienvenida' %}">
      Volver al inicio
    </a>
  </main>
</body>
</html>
